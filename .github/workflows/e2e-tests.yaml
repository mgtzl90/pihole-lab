name: E2E Tests Pi-hole

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Crear clúster kind
        uses: helm/kind-action@v1.8.0

      - name: Instalar Chart con Helm
        run: |
          helm install pihole . -n pihole --create-namespace

      - name: Esperar a que el Pod esté listo
        run: |
          kubectl wait --for=condition=ready pod -l app=pihole -n pihole --timeout=120s

      - name: Exponer puertos en segundo plano
        run: |
          kubectl port-forward -n pihole svc/pihole 8080:80 8053:53 &

      - name: Instalar dependencias de Python
        run: |
          pip install requests

      - name: Ejecutar script de pruebas
        run: |
          python3 test_pihole.py