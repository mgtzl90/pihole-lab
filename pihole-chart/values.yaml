image:
  repository: pihole/pihole
  tag: 2024.07.0
  pullPolicy: IfNotPresent

service:
  type: NodePort
  httpPort: 80
  dnsPort: 53
  httpNodePort: 30080
  dnsNodePort: 30053

env:
  TZ: "America/Mexico_City"
  WEBPASSWORD: "admin"

persistence:
  etcPihole:
    hostPath: "/var/pihole/etc-pihole"
  etcDnsmasq:
    hostPath: "/var/pihole/etc-dnsmasq.d"